name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.MD'
    branches:
      - "master"
      - "develop"
      - "ft**"
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches:
      - "master"
      - "develop"
  # To run the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - run: java --version
      - name: Prepare fake google-services.json
        run: |
          cp google-services.json_template app/google-services.json
          cp secrets.defaults.properties secrets.properties
          cp secrets.defaults.properties staging.properties
          cp secrets.defaults.properties release.properties
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Test with Gradle
        run: ./gradlew testDebugUnitTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/